name: Check publication DOIs

on:
  pull_request:
    paths:
      - README.md
      - scripts/check_dois.py
      - .github/workflows/check-publication-dois.yml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-dois-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-dois:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check README DOIs against doi.org
        # The weekly run also fails when a publisher link can switch to doi.org, so the owner hears about it.
        run: python scripts/check_dois.py ${{ github.event_name == 'schedule' && '--fail-on-action' || '' }}

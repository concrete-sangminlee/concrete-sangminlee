name: Validate profile site

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate and build profile site
        run: make check

      - name: Render link preview image
        run: python scripts/render_og_png.py --require

      - name: Upload site artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: profile-site-preview
          path: docs
